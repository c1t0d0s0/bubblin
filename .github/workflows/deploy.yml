name: Deploy Bubblin to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Inject GTM_ID and Firebase Config from repository variables
        shell: bash
        run: |
          # If vars.GTM_ID is defined in repository variables, generate/inject config.js
          if [ -n "${{ vars.GTM_ID }}" ]; then
            echo "Injecting GTM_ID from repository variable vars.GTM_ID..."
            echo "const GTM_ID = '${{ vars.GTM_ID }}';" > config.js
          fi
          # If vars.FIREBASE_CONFIG is defined in repository variables or secrets, append to config.js
          if [ -n "${{ vars.FIREBASE_CONFIG }}" ]; then
            echo "Injecting FIREBASE_CONFIG from repository variables..."
            echo "const FIREBASE_CONFIG = ${{ vars.FIREBASE_CONFIG }};" >> config.js
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_GTM_ID: ${{ vars.GTM_ID }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
